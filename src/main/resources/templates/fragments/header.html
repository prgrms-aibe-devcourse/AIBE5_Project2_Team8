<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<header th:fragment="headerFragment">
    <style>
        .header-auth-group {
            display: flex;
            align-items: center;
            gap: 1.1rem;
        }
        .btn-chat-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 1.1rem;
            border: 1px solid transparent;
            border-radius: 999px;
            color: #e5e7eb;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .btn-chat-pill:hover,
        .btn-chat-pill.active {
            background-color: #1e2433;
            border-color: #4b5563;
            color: #fff;
        }
        .header-divider {
            width: 1px;
            height: 14px;
            background-color: #3a4256;
            margin: 0 0.2rem;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .role-badge-junior {
            border: 1px solid rgba(59, 130, 246, 0.4);
            background-color: rgba(59, 130, 246, 0.08);
            color: #60a5fa;
        }
        .role-badge-senior {
            border: 1px solid rgba(0, 207, 232, 0.4);
            background-color: rgba(0, 207, 232, 0.08);
            color: #00CFE8;
        }
        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }
        .dot-junior { background-color: #60a5fa; box-shadow: 0 0 6px #60a5fa; }
        .dot-senior { background-color: #00CFE8; box-shadow: 0 0 6px #00CFE8; }

        .btn-logout {
            color: #9ca3af;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .btn-logout:hover {
            color: #f3f4f6;
        }
    </style>

    <nav class="navbar navbar-expand-lg navbar-dark header-nav fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-inline-flex align-items-center gap-2" th:href="@{/}">
                <img src="/images/Knoc_logo.png" alt="Knoc 로고" class="knoc-logo"/>
                <span>Knoc<span class="text-mint">.</span></span>
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">시니어 매칭</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/reviews/posts}">멘토링 후기</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/senior/apply}">시니어 지원하기</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3" sec:authorize="!isAuthenticated()">
                    <a th:href="@{/auth/login}" class="text-decoration-none text-white">로그인</a>
                    <a th:href="@{/auth/signup}" class="btn btn-mint rounded-pill px-4">회원가입</a>
                </div>

                <div class="header-auth-group" sec:authorize="isAuthenticated()">

                    <a th:href="@{/chat/rooms}" class="btn-chat-pill" id="nav-chat-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        채팅
                    </a>

                    <a th:href="@{/my/dashboard}" class="btn-chat-pill" id="nav-mentoring-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        내 멘토링
                    </a>

                    <div class="header-divider"></div>

                    <div class="role-badge role-badge-senior" sec:authorize="hasRole('SENIOR')">
                        <span class="status-dot dot-senior"></span>시니어
                    </div>

                    <div class="role-badge role-badge-junior" sec:authorize="hasRole('USER')">
                        <span class="status-dot dot-junior"></span>주니어
                    </div>

                    <form th:action="@{/auth/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-link text-decoration-none btn-logout">로그아웃</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.location.pathname.startsWith('/chat')) {
                const chatBtn = document.getElementById('nav-chat-btn');
                if (chatBtn) {
                    chatBtn.classList.add('active');
                }
            }

            if (window.location.pathname.startsWith('/my')) {
                const mentoringBtn = document.getElementById('nav-mentoring-btn');
                if (mentoringBtn) {
                    mentoringBtn.classList.add('active');
                }
            }
        });
    </script>
</header>
</html>
