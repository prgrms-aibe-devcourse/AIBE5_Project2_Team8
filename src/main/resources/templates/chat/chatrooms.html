<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">

<head>
    <title>채팅</title>
</head>

<th:block layout:fragment="head-extra">
    <link rel="stylesheet" th:href="@{/css/chatrooms.css}">
    <script src="https://js.tosspayments.com/v2/standard"></script>
</th:block>

<main layout:fragment="content">
    <div class="chat-container">

        <div class="chat-sidebar" id="chatSidebar">
            <div class="sidebar-header">
                <span>💬 메시지</span>
                <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="사이드바 닫기">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
                    </svg>
                </button>
            </div>
            <div class="sidebar-list">

                <div th:if="${#lists.isEmpty(rooms)}" class="sidebar-empty">
                    참여 중인 채팅방이 없어요
                </div>

                <th:block th:each="room : ${rooms}">
                    <a th:href="@{/chat/{id}(id=${room.id})}"
                       th:with="opponent=${room.junior.email == #authentication.name ? room.senior : room.junior}"
                       th:classappend="${room.id == selectedRoomId} ? ' active' : ''"
                       th:attr="data-room-id=${room.id}"
                       class="room-item">

                        <div class="room-avatar" th:text="${#strings.substring(opponent.nickname, 0, 1)}"></div>

                        <div class="room-info">
                            <div class="room-name" th:text="${opponent.nickname}"></div>
                            <div class="room-preview"
                                 th:text="${latestMessages[room.id] != null ? latestMessages[room.id].content : '아직 메시지가 없어요'}">
                            </div>
                        </div>

                        <div class="room-time"
                             th:if="${latestMessages[room.id] != null}"
                             th:text="${#temporals.format(latestMessages[room.id].createdAt, 'MM/dd')}">
                        </div>

                    </a>
                </th:block>

            </div>
        </div>

        <div class="chat-main">

            <div th:if="${selectedRoomId == null}" class="chat-empty">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="#00CFE8" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <p>채팅방을 선택해주세요</p>
            </div>

            <th:block th:if="${selectedRoomId != null}"
                      th:with="opponent=${selectedRoom.junior.email == #authentication.name ? selectedRoom.senior : selectedRoom.junior}">

                <div class="chat-header">
                    <button class="sidebar-open-btn" id="sidebarOpenBtn" onclick="toggleSidebar()" title="사이드바 열기">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
                        </svg>
                    </button>
                    <div class="chat-header-avatar" th:text="${#strings.substring(opponent.nickname, 0, 1)}"></div>
                    <div class="chat-header-name" th:text="${opponent.nickname}"></div>
                    <span id="connectionStatus" class="connection-status status-disconnected">종료됨</span>

                    <!--
                        시니어 전용 '결제 요청하기' 버튼.
                        - ACTIVE 상태의 채팅방에서만 노출
                        - 해당 채팅방에 이미 결제 요청(Order)이 있으면 서버가 아예 렌더하지 않음 (hasPaymentRequest=true)
                        - 초기 렌더 이후 시니어가 버튼을 눌러 PAYMENT_REQUESTED 시스템 메시지가 수신되면
                          chat.js가 이 버튼을 즉시 숨긴다 (display: none)
                    -->
                    <button type="button"
                            id="requestPaymentBtn"
                            class="btn-request-payment"
                            th:if="${isSenior and selectedRoom.status.name() == 'ACTIVE' and !hasPaymentRequest}"
                            onclick="openPaymentRequestModal()">
                        <span>💳</span>
                        <span>결제 요청하기</span>
                    </button>
                </div>

                <!-- 메시지 목록 -->
                <div class="chat-messages" id="messageList"
                th:attr="data-first-message-id=${firstMessageId}">
                    <th:block th:each="msg : ${messages}">

                        <div th:if="${msg.messageType.name() != 'USER'}"
                             th:classappend="${
                                msg.messageType.name() == 'PAYMENT_REQUESTED' ? ' type-payment' :
                                (msg.messageType.name() == 'REVIEW_REQUESTED' ? ' type-review' : ' type-default')
                             }"
                             class="system-message-card">

                            <div class="sys-header text-yellow" th:if="${msg.messageType.name() == 'PAYMENT_REQUESTED'}">
                                <span style="margin-right: 6px;">!</span> 시스템 알림
                            </div>
                            <div class="sys-header text-blue" th:if="${msg.messageType.name() == 'REVIEW_REQUESTED'}">
                                <span style="margin-right: 6px;">📄</span> 시스템 알림
                            </div>
                            <div class="sys-header text-gray" th:if="${msg.messageType.name() == 'ROOM_CLOSE'}">
                                <span style="margin-right: 6px;">🔒</span> 시스템 알림
                            </div>
                            <div class="sys-header text-gray"
                                 th:if="${msg.messageType.name() != 'PAYMENT_REQUESTED' and msg.messageType.name() != 'REVIEW_REQUESTED' and msg.messageType.name() != 'ROOM_CLOSE'}">
                                <span style="margin-right: 6px;">🔔</span> 시스템 알림
                            </div>

                            <div class="sys-body"
                                 th:text="${#strings.replace(msg.content, '\\\\n', '\n')}"></div>

                            <!-- PAYMENT_REQUESTED: 주니어에게만 결제 버튼 노출 -->
                            <div class="sys-footer"
                                 th:if="${msg.messageType.name() == 'PAYMENT_REQUESTED' and !isSenior and msg.referenceId != null}">
                                <button type="button"
                                        class="sys-action-btn btn-yellow action-pay"
                                        th:attr="data-order-id=${msg.referenceId}"
                                        th:text="|🛡️ 에스크로 안전 결제 ₩${#numbers.formatInteger(orderAmounts[msg.referenceId] ?: 0, 0, 'COMMA')}|">
                                </button>
                            </div>

                            <!-- REVIEW_REQUESTED: 주니어에게만 '리뷰 요청서 작성' 버튼 노출 -->
                            <div class="sys-footer"
                                 th:if="${msg.messageType.name() == 'REVIEW_REQUESTED' and !isSenior}">
                                <button type="button"
                                        class="sys-action-btn btn-blue action-review"
                                        th:attr="data-room-id=${selectedRoomId}">
                                    📄 리뷰 요청서 작성
                                </button>
                            </div>
                        </div>

                        <div th:if="${msg.messageType.name() == 'USER'}" th:class="${msg.sender.nickname == currentNickname} ? 'msg-right' : 'msg-left'">
                            <div class="msg-sender" th:text="${msg.sender.nickname}"></div>
                            <div class="msg-bubble" th:text="${msg.content}"></div>
                            <div class="msg-time" th:text="${#temporals.format(msg.createdAt, 'HH:mm')}"></div>
                        </div>

                    </th:block>
                </div>

                <div class="chat-input-area" id="inputArea" th:if="${selectedRoom.status.name() == 'ACTIVE'}">
                    <input type="text"
                           id="messageInput"
                           placeholder="메시지를 입력하세요..."
                           autocomplete="off"/>
                    <button class="btn-send" onclick="sendMessage()">전송</button>
                </div>

                <div class="chat-input-area disabled" id="inputAreaDisabled" th:if="${selectedRoom.status.name() == 'CLOSED'}">
                    <input type="text"
                           id="messageInputDisabled"
                           placeholder="마감된 멘토링입니다. 메시지 전송이 제한됩니다."
                           disabled
                           style="background-color: #2a2a2a; color: #777; cursor: not-allowed;" />
                    <button class="btn-send" disabled style="background-color: #333; color: #555; cursor: not-allowed;">전송</button>
                </div>

                <div class="chat-readonly-banner" id="readonlyBanner" th:if="${selectedRoom.status.name() == 'CLOSED'}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff5252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <span>마감된 멘토링입니다. 더 이상 메시지를 보낼 수 없습니다.</span>
                </div>

                <th:block th:replace="~{chat/fragments/payment-request-modal :: paymentRequestModal(${isSenior})}"></th:block>
                <th:block th:replace="~{chat/fragments/payment-detail-modal :: paymentDetailModal(${isSenior}, ${selectedRoomId})}"></th:block>
                <th:block th:replace="~{chat/fragments/review-request-modal :: reviewRequestModal(${isSenior})}"></th:block>

            </th:block>

        </div>
    </div>
</main>

<th:block layout:fragment="script">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <!--
        Thymeleaf 모델 값을 window.*로 주입. 실제 STOMP 연결/렌더링/페이지네이션은 chat.js가 전담한다.
        /*[[${expr}]]*/ defaultValue 문법은 Thymeleaf의 "JavaScript inlining" 공식 표기법으로,
        - 런타임: 서버가 /*[[...]]*/ 와 뒤의 placeholder 전체를 실제 값으로 치환
    -->
    <script th:inline="javascript">
        window.ROOM_ID = /*[[${selectedRoomId}]]*/ null;
        window.CURRENT_NICKNAME = /*[[${currentNickname}]]*/ '';
        window.ROOM_STATUS = /*[[${roomStatus}]]*/ 'ACTIVE';
        window.IS_SENIOR = /*[[${isSenior}]]*/ false;
        window.JUNIOR_ID = /*[[${juniorId}]]*/ null;
        window.FIRST_MESSAGE_ID = /*[[${firstMessageId}]]*/ null;
        window.SENIOR_PRICE_PER_REVIEW = /*[[${seniorPricePerReview}]]*/ 0;

        // Toss Payments (프론트 결제창 호출용)
        window.__TOSS_CLIENT_KEY__ = /*[[${tossClientKey}]]*/ "";
        window.__TOSS_SUCCESS_PATH__ = "/orders/payment/toss/success";
        window.__TOSS_FAIL_PATH__ = "/orders/payment/toss/fail";
    </script>

    <script src="/js/toss-pay.js"></script>
    <script src="/js/chat.js"></script>
</th:block>

</html>
